# ---------- Preset hotkeys ----------
# r        RIFE interpolation (film; output rate auto-locks to the display)
# u        AnimeJaNai 2x neural upscale (anime up to 1080p -> 4K, fps unchanged)
# e        "Envy" mode: upscale + interpolation in one graph (the main anime key)
# 8        8K profile: neural 2x to 7680x4320 for 4K sources, NO interpolation
#          (RIFE+8K together don't fit the 5090 budget; measured 36 fps at 4K->8K)
# Mode keys are exclusive: enabling one disables the previous. Same key = off.
# b        debanding on/off (anime, streams with gradient banding)
# TAB      stats panel (fps, drops, filters)

# r, u and e are registered by scripts/smart-modes.lua: keys are exclusive
# (enabling one mode disables the other), upscale networks stay off on HDR
b cycle deband
TAB script-binding stats/display-stats-toggle

# Deband presets (ported from the Deband MPV HLSL shaders to native options)
1 apply-profile deband-light  ; show-text "Deband: Light (30/10/2/10)"
2 apply-profile deband-medium ; show-text "Deband: Medium (40/15/3/20)"
3 apply-profile deband-strong ; show-text "Deband: Strong (60/25/4/40)"
4 apply-profile deband-xtreme ; show-text "Deband: Xtreme (80/35/4/50)"
5 apply-profile deband-hdr    ; show-text "Deband: HDR (grain 4, no brightness lift)"
0 set deband no               ; show-text "Deband: off"

# Dynamic tone mapping on/off - to prove the "washes out at exact timecodes"
# diagnosis. Sit on the offending timecode and toggle: if the wash only happens
# with it on, the cause is confirmed and the cure is already in mpv.conf.
p cycle-values hdr-compute-peak "yes" "no" ; show-text "Dynamic tone mapping: ${hdr-compute-peak}" 3000

# mouse wheel: volume
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2

# Non-linear stretch (Envy NLS): scope 2.35:1 fills the 16:9 screen,
# faces in the center stay undistorted. N restores the original aspect.
# n picks the right axis by aspect ratio: 4:3 -> superview, scope -> scope-fill
n script-binding nls-toggle
N script-binding nls-off
# Live-tune how the stretch is split: Alt+n = more zoom (less edge
# distortion, loses more of the sides), Alt+N = more stretch.
Alt+n script-binding nls-more-zoom
Alt+N script-binding nls-less-zoom


# Visual console: live metrics, frame budget, render passes, active modes.
# The line that matters: BUDGET — how many ms of the available frame time the
# render actually eats, and how many times per second it is really computed
# (with interpolation that's the panel rate, not the video rate).
F1 script-binding console-toggle
i script-binding console-toggle

# On-screen menu: every mode as a button, driven by the mouse. Shows what's on.
# Right-click on the picture opens and closes it as well.
m          script-binding gui-toggle
MBTN_RIGHT script-binding gui-toggle
