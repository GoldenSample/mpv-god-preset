# ---------- Хоткеи пресета ----------
# r        RIFE-уплавнялка (кино; частота подбирается под дисплей сама)
# u        AnimeJaNai 2x нейро-апскейл (аниме до 1080p -> 4K, fps не меняет)
# e        режим "Envy": апскейл + уплавнялка одним графом (основная кнопка для аниме)
# 8        8K-профиль: нейро-апскейл 2x до 7680x4320 для 4K-исходников, БЕЗ уплавнялки
#          (RIFE+8K вместе в бюджет 5090 не влезают; замер 36 fps на 4K->8K)
# Кнопки эксклюзивны: включение режима само снимает предыдущий. Выключение = та же кнопка.
# b        дебандинг вкл/выкл (аниме, стримы с полосами в градиентах)
# TAB      панель статистики (fps, дропы, фильтры)

# r, u и e регистрирует scripts/smart-modes.lua: кнопки эксклюзивны (включение
# одного режима снимает другой), на HDR апскейл-сеть не включается
b cycle deband
TAB script-binding stats/display-stats-toggle

# Пресеты дебанда Bei (шейдеры Deband MPV, перенесены в родные опции mpv)
1 apply-profile deband-light  ; show-text "Дебанд: Light (30/10/2/10)"
2 apply-profile deband-medium ; show-text "Дебанд: Medium (40/15/3/20)"
3 apply-profile deband-strong ; show-text "Дебанд: Strong (60/25/4/40)"
4 apply-profile deband-xtreme ; show-text "Дебанд: Xtreme (80/35/4/50)"
5 apply-profile deband-hdr    ; show-text "Дебанд: HDR (зерно 4, без всплытия яркости)"
0 set deband no               ; show-text "Дебанд: выкл"

# Динамический тонмаппинг вкл/выкл - для проверки "белесы по таймкодам".
# Встань на проблемный таймкод и жми p туда-обратно: если белеса появляется
# только при "вкл", причина найдена и лечение уже в конфиге.
p cycle-values hdr-compute-peak "yes" "no" ; show-text "Динамический тонмаппинг: ${hdr-compute-peak}" 3000

# колесо мыши: громкость
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2

# NLS: скоуп заполняет экран, лица в центре не искажаются
# n сама выбирает по соотношению сторон: 4:3 -> superview, скоуп -> scope-fill
n script-binding nls-toggle
N script-binding nls-off
# Живая крутилка доли зума в NLS (0 = только стретч, 1 = только обрезка)
Alt+n script-binding nls-more-zoom
Alt+N script-binding nls-less-zoom

# Анти-блуминг: срез пика яркости до телевизора. Меньше пик - меньше повод
# у панели поджигать зону под свечой. Цена: света тусклее. Сравнивать на
# одной и той же сцене со свечами, k по кругу.
k cycle-values profile peak-1000 peak-600 peak-400
K set target-peak auto ; show-text "Пик: как в метаданных (срез выключен)"

# Профиль анти-блуминга целиком (пик 600 + поднятый пол чёрного + мягкая
# кривая). Сильнее, чем один k. Alt+A вернуть как было.
A apply-profile hdr-antibloom         ; show-text "Анти-блуминг: ВКЛ (пик 600, пол чёрного 0.2 нит)"
Alt+a apply-profile hdr-antibloom restore ; show-text "Анти-блуминг: выкл"

# Тёмное кино в SDR: самый сильный рычаг против ореолов из всех, что есть
# на нашей стороне. СНАЧАЛА выключить HDR в Windows (Win+Alt+B), потом S.
S apply-profile sdr-dark-cinema         ; show-text "SDR тёмное кино: ВКЛ (выключи HDR в Windows!)"
Alt+s apply-profile sdr-dark-cinema restore ; show-text "SDR тёмное кино: выкл"

# Визуальная консоль: живые метрики, бюджет кадра, состав цепочки, режимы.
# Главное в ней - строка БЮДЖЕТ: она показывает, успевает ли рендер в
# отведённое время, и сколько раз в секунду он на самом деле считается.
F1 script-binding console-toggle
i script-binding console-toggle

# On-screen menu: every mode as a button, driven by the mouse. Shows what's on.
# Right-click on the picture opens and closes it as well.
m         script-binding gui-toggle
MBTN_RIGHT script-binding gui-toggle

# Апскейл ЖИВОГО кино нейросетью (стримы/сериалы/веб-рипы, не зернистые
# ремуксы и не аниме). Эксклюзивна с r/u/e/8. Модель 2xLiveActionV1_SPAN.
L script-binding smart-liveaction
