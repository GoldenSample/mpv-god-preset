# ---------- Hotkeys (Bei's home theater preset) ----------
# 1-3      deband presets (light / medium / strong)
# 5        deband for HDR sources (near-zero grain)
# 0        deband off (also: the "wrong autodetect" escape hatch)
# b        deband on/off with current values
# n / N    NLS scope-fill on / off (2.35:1 fills the screen)
# a        audio passthrough on/off (off = PCM decode in mpv)
# H        auto refresh switching on/off
# TAB      stats panel (fps, drops, filters, passthrough state)

b cycle deband
TAB script-binding stats/display-stats-toggle

1 apply-profile deband-light  ; show-text "Deband: Light (30/10/2/10)"
2 apply-profile deband-medium ; show-text "Deband: Medium (40/15/3/20)"
3 apply-profile deband-strong ; show-text "Deband: Strong (60/25/4/40)"
5 apply-profile deband-hdr    ; show-text "Deband: HDR (grain 4)"
0 set deband no               ; show-text "Deband: off"

# Non-linear stretch, one key for both cases: n looks at the aspect ratio
# and picks the axis itself (4:3 -> superview, scope 2.35:1 -> scope-fill).
n script-binding nls-toggle
N script-binding nls-off

# Audio passthrough toggle (troubleshooting / TV speakers)
a cycle-values audio-spdif "ac3,eac3,dts,dts-hd,truehd" "" ; show-text "Passthrough toggled - see TAB"
