# ============================================================
#  mpv preset: RTX 3060 Ti / i5-12400 / 24 GB / 4K TV through an AVR
#  (Bei's home theater profile of mpv-god-preset)
#
#  Design goals, in order:
#    1. Bitstream audio passthrough to the AV receiver (Dolby/DTS untouched)
#    2. Auto switch to film cadence (23/24 Hz) like madVR did
#    3. Anime gets deband + sharpen treatment AUTOMATICALLY,
#       movies stay untouched — no more toggling by hand
#    4. NLS scope-fill on a hotkey (2.35:1 fills the screen, faces intact)
#  Everything runs comfortably on a 3060 Ti at 4K24 — the heavy neural
#  stuff (RIFE interpolation, AnimeJaNai) is deliberately NOT enabled here.
# ============================================================

# ---------- Renderer ----------
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe

# Scaling: measured sweet spot from the main preset (see repo README).
# ewa_lanczossharp at 1080p->4K costs single-digit milliseconds on a 3060 Ti.
scale=ewa_lanczossharp
scale-antiring=0.8
cscale=ewa_lanczossharp
cscale-antiring=0.8
dscale=hermite

# 10-bit-aware dithering
dither-depth=auto
dither=fruit

# ---------- HDR ----------
# Pass HDR through to the TV instead of tone-mapping on the PC.
# Needs fullscreen; the TV then applies its own HDR pipeline.
target-colorspace-hint=yes

# ---------- Motion ----------
# With auto-refresh.lua matching the display to the film cadence,
# display-resample gives judder-free 24p without any interpolation.
video-sync=display-resample
interpolation=no

# ---------- Audio: bitstream passthrough to the AVR ----------
# The AVR does the decoding (its whole job). Formats the receiver can't
# take will fall back to PCM decoding in mpv automatically.
# If TrueHD passthrough glitches on your HDMI chain, remove "truehd" here —
# it is the fussiest of the bunch.
audio-spdif=ac3,eac3,dts,dts-hd,truehd
# Exclusive WASAPI: required for HD bitstreams (TrueHD / DTS-HD MA).
# Volume is controlled on the AVR, as it should be.
audio-exclusive=yes
# Uncomment and set your HDMI output if mpv picks the wrong device:
#   mpv --audio-device=help    <- lists device names
#audio-device=wasapi/{...}

# ---------- Languages / subs ----------
alang=jpn,ja,eng,en
slang=eng,en
sub-auto=fuzzy

# ---------- QoL ----------
keep-open=yes
save-position-on-quit=yes
osd-bar=yes
screenshot-format=png

# Deband OFF by default: movies stay untouched (that was the whole point).
deband=no
deband-threshold=40
deband-range=15
deband-iterations=3
deband-grain=20

# ============================================================
#  Profiles
# ============================================================

# ---------- Deband presets (keys 1-5, 0 = off) ----------
# Same values as the "Deband MPV" HLSL shaders you used in MPC-HC —
# that shader is a port of mpv's own deband, so this is the original.
[deband-light]
deband=yes
deband-threshold=30
deband-range=10
deband-iterations=2
deband-grain=10

[deband-medium]
deband=yes
deband-threshold=40
deband-range=15
deband-iterations=3
deband-grain=20

[deband-strong]
deband=yes
deband-threshold=60
deband-range=25
deband-iterations=4
deband-grain=40

# HDR variant: near-zero grain. libplacebo warns that grain on HDR
# produces large brightness swings.
[deband-hdr]
deband=yes
deband-threshold=40
deband-range=15
deband-iterations=3
deband-grain=4

# ---------- The anime look ----------
[anime]
deband=yes
deband-iterations=2
deband-grain=24

# ---------- Anime AUTODETECT ----------
# "it would be nice if it detects like its an anime content and then
#  applies all settings while for movies it leaves it alone" — this.
# Trigger: release-group tags in the filename, or an "anime" folder
# anywhere in the path. Extend the list with your own groups.
# Wrong guess? Key 0 turns deband off for the current file.
[auto-anime]
profile-cond=(function() local p=((path or '')..'/'..(filename or '')):lower(); for _,tag in ipairs({'subsplease','erai-raws','horriblesubs','ember','asw]','judas','commie','nyaa','/anime/','\\anime\\'}) do if p:find(tag,1,true) then return true end end return false end)()
profile-restore=copy
profile=anime

# ---------- NLS: scope fills the screen (key n, N = off) ----------
# 2.35:1 -> 16:9 without warped faces: linear stretch + center-protecting
# shader. Verified on a circle grid: center row stays perfectly round.
[scope-fill]
profile-restore=copy
video-aspect-override=16/9
glsl-shaders-append=~~/shaders/nls-scope.glsl

# Same for 4:3 content, horizontal (GoPro Superview style).
[superview]
profile-restore=copy
video-aspect-override=16/9
glsl-shaders-append=~~/shaders/nls-superview.glsl
